<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>מסע הידע: הדגמת מפת המסע</title>
<!--
  Visual prototype of the journey map (ADR 0005).
  One self-contained file: no network, no dependencies, works from file://.
  Everything is drawn in a single 1600x900 SVG, so it scales evenly to any 16:9 projector.
  The theme ("skin") only changes the scenery and the palette; stations and layout stay fixed.
-->
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #1f2a33; }
  body {
    display: grid; place-items: center;
    font-family: "Rubik", "Heebo", "Assistant", "Arial", "Liberation Sans", sans-serif;
  }
  .stage { width: min(100vw, calc(100vh * 16 / 9)); aspect-ratio: 16 / 9; }
  .stage svg { display: block; width: 100%; height: 100%; }
  .stage text { font-family: inherit; }

  .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 1.8s ease-out infinite; }
  @keyframes pulse { 0% { transform: scale(.6); opacity: .8; } 100% { transform: scale(1.6); opacity: 0; } }
  .bob { animation: bob 2.4s ease-in-out infinite; }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
  .drift { animation: drift 40s linear infinite alternate; }
  @keyframes drift { from { transform: translateX(-30px); } to { transform: translateX(30px); } }
  @media (prefers-reduced-motion: reduce) { .pulse, .bob, .drift { animation: none; } }

  /* Demo-only controls (not part of the classroom screen). */
  .controls {
    position: fixed; inset-inline-start: 12px; bottom: 12px; display: flex; gap: 6px; flex-wrap: wrap;
    background: rgba(255,255,255,.92); padding: 8px; border-radius: 12px; font-size: 14px;
    box-shadow: 0 2px 10px rgba(0,0,0,.25);
  }
  .controls button {
    font: inherit; border: 1px solid #b9c3cc; background: #fff; border-radius: 8px; padding: 6px 10px; cursor: pointer;
  }
  .controls button[aria-pressed="true"] { background: #23384a; color: #fff; border-color: #23384a; }
  .hide-controls .controls { display: none; }
</style>
</head>
<body>
<div class="stage" id="stage"></div>

<div class="controls" role="toolbar" aria-label="פקדי הדגמה">
  <span style="align-self:center">ערכה:</span>
  <span id="theme-buttons" style="display:flex;gap:6px"></span>
  <span style="align-self:center;margin-inline-start:8px">תחנה נוכחית:</span>
  <button id="prev" type="button" aria-label="תחנה קודמת">→</button>
  <button id="next" type="button" aria-label="תחנה הבאה">←</button>
</div>

<script>
"use strict";

// ------------------------------------------------------------------ fixed template

const STATIONS = [
  { n: 1, name: "הניצוץ", note: "סרטון ושאלת עוגן", icon: "spark" },
  { n: 2, name: "מגלים", note: "שלושה מפתחות ידע", icon: "key" },
  { n: 3, name: "שולפים", note: "שש משימות", icon: "cards" },
  { n: 4, name: "מחברים", note: "מקרה ושתי הכרעות", icon: "fork" },
  { n: 5, name: "מפצחים", note: "ארבעה מנעולים", icon: "lock" },
  { n: 6, name: "אליפות הידע", note: "שלושה סבבים", icon: "trophy" },
  { n: 7, name: "חותם הידע", note: "עוגן, העברה ומפה", icon: "seal" },
];

// Station positions: right to left (Hebrew reading order), alternating high and low.
const POS = [
  { x: 1440, y: 330 }, { x: 1230, y: 560 }, { x: 1020, y: 330 }, { x: 810, y: 560 },
  { x: 600, y: 330 }, { x: 390, y: 560 }, { x: 180, y: 330 },
];

// Free pockets for scenery, away from the road and the cards.
const POCKET = {
  sky: [{ x: 1230, y: 205 }, { x: 810, y: 205 }, { x: 390, y: 205 }],         // between the upper cards
  midTop: POS.filter((_, i) => i % 2 === 0).map(p => ({ x: p.x, y: 470 })),  // under upper stations
  midLow: POS.filter((_, i) => i % 2 === 1).map(p => ({ x: p.x, y: 425 })),  // above lower stations
  floor: POS.filter((_, i) => i % 2 === 0).map(p => ({ x: p.x, y: 700 })),   // between the lower cards
};

// ------------------------------------------------------------------ themes ("skins")

const THEMES = {
  forest: {
    name: "הרים ויער",
    sky: ["#cfe8f3", "#eef7ea"], ground: "#cfe5b5", groundDark: "#b7d79a",
    road: "#f6f1e3", roadEdge: "#8dbf6a", dash: "#cdbf9e",
    accent: "#2f7d4f", accentSoft: "#dff0e3", ink: "#1f3a2b",
    scenery: forestScenery,
  },
  beach: {
    name: "ים וחוף",
    sky: ["#bfe4f6", "#fdf4de"], ground: "#f4e3b9", groundDark: "#ead39c",
    road: "#fffaf0", roadEdge: "#e2c27f", dash: "#d9c49a",
    accent: "#1f6f99", accentSoft: "#dcecf5", ink: "#173447",
    scenery: beachScenery,
  },
};

// ------------------------------------------------------------------ drawing helpers

const svgNS = "http://www.w3.org/2000/svg";

function roadPath() {
  // Enter from the right edge, S-curves with horizontal tangents, exit at the left edge.
  const pts = [{ x: 1640, y: 250 }, ...POS, { x: -40, y: 470 }];
  let d = `M${pts[0].x} ${pts[0].y}`;
  for (let i = 1; i < pts.length; i++) {
    const a = pts[i - 1], b = pts[i], half = (a.x - b.x) / 2;
    d += ` C${a.x - half} ${a.y} ${b.x + half} ${b.y} ${b.x} ${b.y}`;
  }
  return d;
}

function cloud(x, y, s = 1) {
  return `<g transform="translate(${x} ${y}) scale(${s})" fill="#fff" opacity=".9">
    <ellipse cx="0" cy="10" rx="46" ry="16"/><circle cx="-16" cy="2" r="18"/><circle cx="12" cy="-4" r="22"/></g>`;
}
function bird(x, y, s = 1) {
  return `<path d="M${x - 10 * s} ${y} q${5 * s} ${-6 * s} ${10 * s} 0 q${5 * s} ${-6 * s} ${10 * s} 0"
    fill="none" stroke="#55606b" stroke-width="2" stroke-linecap="round"/>`;
}
function pine(x, y, s = 1, c = "#3f8f5a") {
  return `<g transform="translate(${x} ${y}) scale(${s})">
    <rect x="-4" y="-6" width="8" height="14" fill="#8a6a4a"/>
    <polygon points="0,-62 -22,-24 -12,-24 -26,-4 26,-4 12,-24 22,-24" fill="${c}"/></g>`;
}
function roundTree(x, y, s = 1, c = "#6fb36a") {
  return `<g transform="translate(${x} ${y}) scale(${s})">
    <rect x="-4" y="-14" width="8" height="20" rx="2" fill="#8a6a4a"/>
    <circle cx="0" cy="-30" r="20" fill="${c}"/><circle cx="-7" cy="-36" r="7" fill="#fff" opacity=".18"/></g>`;
}
function palm(x, y, s = 1) {
  return `<g transform="translate(${x} ${y}) scale(${s})">
    <path d="M0 0 C 4 -20, 2 -40, 8 -62" stroke="#a07a4f" stroke-width="7" fill="none" stroke-linecap="round"/>
    <g fill="#4fa36b">
      <path d="M8 -62 C -10 -74, -28 -66, -34 -54 C -20 -62, -6 -62, 8 -62z"/>
      <path d="M8 -62 C 26 -76, 44 -66, 48 -52 C 34 -62, 20 -62, 8 -62z"/>
      <path d="M8 -62 C 0 -84, 16 -92, 26 -88 C 16 -82, 10 -72, 8 -62z"/>
      <path d="M8 -62 C -8 -86, -24 -84, -28 -78 C -16 -76, -2 -70, 8 -62z"/>
    </g><circle cx="6" cy="-58" r="4" fill="#8a5a33"/></g>`;
}
function house(x, y, s = 1, wall = "#f2efe8", roof = "#c8553d") {
  return `<g transform="translate(${x} ${y}) scale(${s})">
    <rect x="-24" y="-30" width="48" height="30" fill="${wall}" stroke="#d9d2c4"/>
    <polygon points="-30,-30 0,-52 30,-30" fill="${roof}"/>
    <rect x="-6" y="-16" width="12" height="16" fill="#8a6a4a"/>
    <rect x="-18" y="-24" width="9" height="8" fill="#9fd0e8"/><rect x="9" y="-24" width="9" height="8" fill="#9fd0e8"/></g>`;
}

// ------------------------------------------------------------------ scenery per theme

function forestScenery(t) {
  const mountains = `
    <g opacity=".95">
      <path d="M-20 250 L120 120 L230 230 L360 90 L520 250 Z" fill="#9cc7b9"/>
      <path d="M300 250 L470 110 L640 250 Z" fill="#b9d6cb"/>
      <path d="M1180 250 L1330 100 L1480 250 Z" fill="#9cc7b9"/>
      <path d="M1380 250 L1520 130 L1640 250 Z" fill="#b9d6cb"/>
      <path d="M330 92 L360 90 L378 108 L356 104 L342 112 Z" fill="#fff"/>
      <path d="M1312 118 L1330 100 L1350 120 L1332 114 Z" fill="#fff"/>
    </g>`;
  const ground = `<path d="M0 240 C 300 210, 600 260, 900 235 S 1400 215, 1600 240 L1600 900 L0 900 Z" fill="${t.ground}"/>
    <path d="M0 820 C 300 790, 700 840, 1000 810 S 1450 800, 1600 820 L1600 900 L0 900 Z" fill="${t.groundDark}"/>`;
  const lake = `<g transform="translate(1020 720)">
      <ellipse rx="92" ry="34" fill="#8fcbe3"/><ellipse rx="70" ry="22" fill="#a9d9ec"/>
      <path d="M-40 -2 q8 -6 16 0 q8 6 16 0 M10 10 q8 -6 16 0 q8 6 16 0" stroke="#fff" stroke-width="2" fill="none"/>
      <path d="M-18 4 q10 -8 20 0 q-10 8 -20 0z M2 4 l8 -6 v12z" fill="#e48a3b"/></g>`;
  const pines = [
    pine(POCKET.midTop[0].x - 30, 520, 1.0), pine(POCKET.midTop[0].x + 20, 530, 1.2, "#2f7d4f"),
    pine(POCKET.midTop[1].x - 50, 525, 0.9), pine(POCKET.midTop[2].x + 10, 528, 1.15, "#2f7d4f"),
    pine(POCKET.midTop[2].x - 40, 520, 0.9), pine(POCKET.midTop[3].x + 15, 525, 1.1),
    pine(POCKET.midLow[0].x + 35, 470, 1.0, "#2f7d4f"), pine(POCKET.midLow[1].x - 30, 470, 1.1),
    pine(POCKET.midLow[2].x + 30, 470, 1.0, "#2f7d4f"),
  ].join("");
  const floor = [
    roundTree(1360, 800, 1.1), roundTree(1520, 805, 0.9, "#5ea05a"),
    roundTree(570, 790, 1.0), roundTree(640, 800, 1.2, "#5ea05a"),
    roundTree(150, 790, 1.1, "#5ea05a"), roundTree(225, 800, 0.9),
    house(1440, 790, 1.15, "#f2efe8", "#a7563a"),
  ].join("");
  const sky = `<g class="drift">${cloud(700, 70, 1)}${cloud(1080, 50, .8)}${cloud(260, 60, .7)}</g>
    <circle cx="${POCKET.sky[2].x}" cy="62" r="34" fill="#f7c95c"/>
    ${bird(860, 110)}${bird(890, 100, .8)}${bird(1250, 150, .9)}`;
  return `${sky}${mountains}${ground}${lake}${pines}${floor}`;
}

function beachScenery(t) {
  const sea = `<path d="M0 150 L1600 150 L1600 245 C 1300 270, 1000 230, 700 255 S 200 240, 0 250 Z" fill="#7cc3e0"/>
    <path d="M0 150 L1600 150 L1600 175 L0 175 Z" fill="#a9daee"/>
    ${[200, 520, 860, 1180, 1480].map(x => `<path d="M${x} 205 q12 -8 24 0 q12 8 24 0" stroke="#fff" stroke-width="2.5" fill="none" opacity=".8"/>`).join("")}`;
  const boat = (x, y, s) => `<g class="bob" style="transform-origin:${x}px ${y}px"><g transform="translate(${x} ${y}) scale(${s})">
      <path d="M-30 0 L30 0 L20 12 L-20 12 Z" fill="#c8553d"/>
      <path d="M0 -2 L0 -50 L26 -6 Z" fill="#fff"/><path d="M-2 -6 L-2 -44 L-22 -6 Z" fill="#f3d27a"/></g></g>`;
  const fish = (x, y) => `<path d="M${x} ${y} q10 -8 20 0 q-10 8 -20 0z M${x + 20} ${y} l8 -6 v12z" fill="#f08a4b"/>`;
  const ground = `<path d="M0 248 C 200 238, 500 262, 700 255 S 1300 268, 1600 245 L1600 900 L0 900 Z" fill="${t.ground}"/>
    <path d="M0 800 C 400 780, 900 830, 1600 800 L1600 900 L0 900 Z" fill="${t.groundDark}"/>`;
  const lighthouse = `<g transform="translate(${POCKET.sky[0].x} 246)">
      <polygon points="-16,0 16,0 10,-92 -10,-92" fill="#fff" stroke="#e1d6c2"/>
      <rect x="-15" y="-30" width="30" height="12" fill="#d0473b"/><rect x="-12" y="-66" width="24" height="12" fill="#d0473b"/>
      <rect x="-12" y="-110" width="24" height="18" fill="#3a556b"/><rect x="-8" y="-106" width="16" height="10" fill="#ffd866"/>
      <polygon points="-16,-110 16,-110 0,-124" fill="#d0473b"/></g>`;
  const umbrella = (x, y, c) => `<g transform="translate(${x} ${y})">
      <line x1="0" y1="0" x2="4" y2="-46" stroke="#7a6a58" stroke-width="3"/>
      <path d="M-30 -40 Q4 -78 38 -52 Z" fill="${c}"/><path d="M-30 -40 Q-6 -56 4 -46 Q18 -60 38 -52" fill="none" stroke="#fff" stroke-width="2"/>
      <ellipse cx="2" cy="2" rx="22" ry="5" fill="#000" opacity=".08"/></g>`;
  const shell = (x, y) => `<path d="M${x} ${y} a10 10 0 0 1 20 0 z" fill="#f3b6a1"/>`;
  const lagoon = `<g transform="translate(600 720)"><ellipse rx="96" ry="34" fill="#8fd0e6"/><ellipse rx="72" ry="22" fill="#b0e1f0"/>${fish(-30, 0)}${fish(14, 8)}</g>`;
  const sky = `<g class="drift">${cloud(560, 70, .9)}${cloud(1000, 55, .75)}${cloud(220, 80, .7)}</g>
    <circle cx="${POCKET.sky[2].x}" cy="62" r="36" fill="#ffcf5c"/>
    ${bird(820, 105)}${bird(850, 95, .8)}${bird(1150, 120, .9)}`;
  const palms = [
    palm(POCKET.midTop[0].x - 20, 545, 1.0), palm(POCKET.midTop[1].x + 25, 545, 1.15),
    palm(POCKET.midTop[2].x - 30, 545, 1.0), palm(POCKET.midTop[3].x + 20, 545, 1.1),
    palm(POCKET.midLow[0].x + 30, 480, .9), palm(POCKET.midLow[2].x - 25, 480, .95),
  ].join("");
  const floor = [
    umbrella(1410, 790, "#e9634f"), umbrella(1490, 800, "#3f9bd0"),
    umbrella(1000, 790, "#f2b33d"), umbrella(180, 795, "#3f9bd0"),
    shell(1060, 820), shell(240, 822), shell(1460, 830),
  ].join("");
  return `${sky}${sea}${boat(420, 205, .9)}${boat(1060, 200, .7)}${fish(700, 225)}${ground}${lighthouse}${lagoon}${palms}${floor}`;
}

// ------------------------------------------------------------------ station icons (white on a coloured disc)

const ICONS = {
  spark: `<polygon points="0,-16 4,-5 16,-5 6,2 10,14 0,7 -10,14 -6,2 -16,-5 -4,-5" fill="#fff"/>`,
  key: `<circle cx="7" cy="-6" r="7" fill="none" stroke="#fff" stroke-width="4"/>
        <path d="M2 -1 L-12 13 M-6 7 L-2 11 M-10 11 L-6 15" stroke="#fff" stroke-width="4" stroke-linecap="round"/>`,
  cards: `<rect x="-14" y="-13" width="17" height="24" rx="3" fill="#fff" opacity=".65" transform="rotate(-12)"/>
          <rect x="-4" y="-12" width="17" height="24" rx="3" fill="#fff" transform="rotate(10)"/>`,
  fork: `<path d="M0 15 L0 -2 M0 -2 L-11 -13 M0 -2 L11 -13" stroke="#fff" stroke-width="4" stroke-linecap="round" fill="none"/>
         <path d="M-15 -11 l2 -7 l7 2 M15 -11 l-2 -7 l-7 2" stroke="#fff" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`,
  lock: `<path d="M-8 -3 V-8 a8 8 0 0 1 16 0 V-3" stroke="#fff" stroke-width="4" fill="none"/>
         <rect x="-12" y="-3" width="24" height="18" rx="4" fill="#fff"/>`,
  trophy: `<path d="M-10 -14 H10 V-4 a10 10 0 0 1 -20 0 Z" fill="#fff"/>
           <path d="M-10 -10 h-5 a5 5 0 0 0 5 8 M10 -10 h5 a5 5 0 0 1 -5 8" stroke="#fff" stroke-width="2.5" fill="none"/>
           <rect x="-2" y="5" width="4" height="6" fill="#fff"/><rect x="-8" y="11" width="16" height="4" rx="1" fill="#fff"/>`,
  seal: `<circle r="10" fill="#fff"/><circle r="6" fill="none" stroke="currentColor" stroke-width="2"/>
         <path d="M-6 8 L-9 17 L-3 14 L0 18 M6 8 L9 17 L3 14 L0 18" fill="#fff"/>`,
};
const CHECK = `<path d="M-6 0 L-2 4 L6 -5" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`;
const LOCK_SMALL = `<path d="M-4 -2 V-5 a4 4 0 0 1 8 0 V-2" stroke="currentColor" stroke-width="2" fill="none"/>
  <rect x="-6" y="-2" width="12" height="9" rx="2" fill="currentColor"/>`;

// ------------------------------------------------------------------ stations: pin + card

function stationMarkup(t, i, current) {
  const s = STATIONS[i], p = POS[i];
  const state = i < current ? "done" : i === current ? "now" : "next";
  const upper = i % 2 === 0;
  const muted = "#9aa5ae";
  const pinColor = state === "next" ? muted : t.accent;

  // Card above upper stations, below lower ones; a short stem links it to the pin.
  const cw = 214, ch = 96;
  const cx = p.x - cw / 2, cy = upper ? p.y - 70 - ch - 46 : p.y + 34;
  const stemY1 = upper ? cy + ch : cy, stemY2 = upper ? p.y - 70 : p.y + 12;
  const cardStroke = state === "now" ? t.accent : "#e3ddd0";
  const cardOpacity = state === "next" ? 0.82 : 1;
  const status = state === "done"
    ? `<g transform="translate(${cx + 26} ${cy + 74})"><circle r="10" fill="${t.accent}"/>${CHECK}</g>
       <text x="${cx + 42}" y="${cy + 79}" text-anchor="start" direction="ltr" font-size="15" fill="${t.accent}" font-weight="700">הושלם</text>`
    : state === "now"
    ? `<rect x="${cx + 14}" y="${cy + 62}" width="92" height="24" rx="12" fill="${t.accent}"/>
       <text x="${cx + 60}" y="${cy + 79}" text-anchor="middle" font-size="15" fill="#fff" font-weight="700">אנחנו כאן</text>`
    : `<g transform="translate(${cx + 26} ${cy + 74})" color="${muted}">${LOCK_SMALL}</g>`;

  const card = `<g opacity="${cardOpacity}">
    <line x1="${p.x}" y1="${stemY1}" x2="${p.x}" y2="${stemY2}" stroke="${cardStroke}" stroke-width="3" stroke-dasharray="2 5" stroke-linecap="round"/>
    <rect x="${cx + 3}" y="${cy + 5}" width="${cw}" height="${ch}" rx="18" fill="#000" opacity=".08"/>
    <rect x="${cx}" y="${cy}" width="${cw}" height="${ch}" rx="18" fill="#fff" stroke="${cardStroke}" stroke-width="${state === "now" ? 4 : 2}"/>
    <g transform="translate(${cx + cw - 34} ${cy + 34})" color="${pinColor}"><circle r="22" fill="${pinColor}"/>${ICONS[s.icon]}</g>
    <text x="${cx + cw - 66}" y="${cy + 33}" font-size="24" font-weight="800" fill="${state === "next" ? "#6b7680" : t.ink}">${s.name}</text>
    <text x="${cx + cw - 66}" y="${cy + 56}" font-size="15" fill="#5f6b75">${s.note}</text>
    ${status}
  </g>`;

  // Map pin with the station number.
  const r = state === "now" ? 30 : 24;
  const pin = `<g transform="translate(${p.x} ${p.y})">
    ${state === "now" ? `<circle cy="${-r * 1.75}" r="${r + 8}" fill="${t.accent}" opacity=".35" class="pulse"/>` : ""}
    <ellipse cx="0" cy="${r * 0.15}" rx="${r * 0.9}" ry="${r * 0.35}" fill="#000" opacity=".12"/>
    <path d="M0 0 C ${-r * .55} ${-r * .7}, ${-r} ${-r * 1.25}, ${-r} ${-r * 1.75} a${r} ${r} 0 0 1 ${2 * r} 0 C ${r} ${-r * 1.25}, ${r * .55} ${-r * .7}, 0 0 Z"
      fill="${pinColor}" stroke="#fff" stroke-width="3"/>
    <text x="0" y="${-r * 1.75 + r * 0.38}" text-anchor="middle" font-size="${r * 1.0}" font-weight="800" fill="#fff" direction="ltr">${s.n}</text>
  </g>`;
  return { card, pin };
}

// ------------------------------------------------------------------ whole screen

function render(themeKey, current) {
  const t = THEMES[themeKey];
  const road = roadPath();
  const parts = STATIONS.map((_, i) => stationMarkup(t, i, current));
  const doneCount = current;
  const header = `
    <g>
      <rect x="1060" y="18" width="520" height="70" rx="35" fill="#fff" opacity=".94"/>
      <text x="1550" y="52" font-size="30" font-weight="800" fill="${t.ink}">מסע הידע: מחזור המים</text>
      <text x="1550" y="76" font-size="17" fill="#5f6b75">מדעים · כיתות ה׳–ו׳</text>
      <rect x="20" y="18" width="250" height="54" rx="27" fill="#fff" opacity=".94"/>
      <text x="245" y="52" font-size="19" fill="${t.ink}" font-weight="700">ערכה: ${t.name}</text>
    </g>`;
  const footer = `
    <g>
      <rect x="560" y="838" width="480" height="50" rx="25" fill="${t.accent}"/>
      <text x="800" y="871" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">
        ${doneCount} מתוך 7 תחנות הושלמו · עכשיו: ${STATIONS[current].name}</text>
    </g>`;

  return `<svg xmlns="${svgNS}" viewBox="0 0 1600 900" role="img"
      aria-label="מפת מסע הידע: שבע תחנות לאורך שביל, ${STATIONS[current].name} היא התחנה הנוכחית">
    <defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${t.sky[0]}"/><stop offset="1" stop-color="${t.sky[1]}"/></linearGradient></defs>
    <rect width="1600" height="900" fill="url(#sky)"/>
    ${t.scenery(t)}
    <path d="${road}" fill="none" stroke="${t.roadEdge}" stroke-width="74" stroke-linecap="round"/>
    <path d="${road}" fill="none" stroke="${t.road}" stroke-width="58" stroke-linecap="round"/>
    <path d="${road}" fill="none" stroke="${t.dash}" stroke-width="4" stroke-dasharray="18 16"/>
    ${parts.map(p => p.card).join("")}
    ${parts.map(p => p.pin).join("")}
    ${header}${footer}
  </svg>`;
}

// ------------------------------------------------------------------ demo wiring

const params = new URLSearchParams(location.search);
let theme = THEMES[params.get("theme")] ? params.get("theme") : "forest";
let current = Math.min(6, Math.max(0, Number(params.get("station") || 4) - 1));
if (params.has("clean")) document.body.classList.add("hide-controls");

const themeButtons = document.getElementById("theme-buttons");
for (const [key, t] of Object.entries(THEMES)) {
  const b = document.createElement("button");
  b.type = "button"; b.textContent = t.name; b.dataset.theme = key;
  b.addEventListener("click", () => { theme = key; draw(); });
  themeButtons.append(b);
}
document.getElementById("prev").addEventListener("click", () => { current = Math.max(0, current - 1); draw(); });
document.getElementById("next").addEventListener("click", () => { current = Math.min(6, current + 1); draw(); });

function draw() {
  document.getElementById("stage").innerHTML = render(theme, current);
  for (const b of themeButtons.children) b.setAttribute("aria-pressed", String(b.dataset.theme === theme));
}
draw();
</script>
</body>
</html>
